name: 3D bindings

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Build the tested Goose compiler revision
        run: |
          git clone https://github.com/aardappel/goose.git build/goose-source
          git -C build/goose-source switch --detach f605b5a07dd2aa3a5cb3f4c9b14002bd3c9d3d1a
          nix develop --command cmake -S build/goose-source -B build/goose-compiler
          nix develop --command cmake --build build/goose-compiler --parallel 2
      - name: Native tests and real software-rendered frames
        run: |
          export GOOSE="$PWD/build/goose-compiler/goose"
          nix develop --command python3 tests/run_3d.py
